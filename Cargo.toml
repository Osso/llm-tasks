[package]
name = "llm-tasks"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Task persistence for LLM agent orchestration"
repository = "https://github.com/Osso/llm-tasks"

[[bin]]
name = "lt"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.35", features = ["bundled"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
rand = "0.9"
dirs = "6"
anyhow = "1.0.102"
axum = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[dev-dependencies]
tempfile = "3.26.0"
